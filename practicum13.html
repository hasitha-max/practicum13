<!DOCTYPE html>
<html>
<head>
    <title>CraftSphere - Craft Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee6fa, #fff0df);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(80, 60, 100, 0.15);
        }

        h1 {
            text-align: center;
            color: #76549b;
        }

        .subtitle {
            text-align: center;
            color: #a0522d;
            margin-bottom: 25px;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #d6c5eb;
            border-radius: 7px;
            font-size: 15px;
            min-width: 0;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #a0522d;
            color: white;
        }

        .add-btn:hover {
            background: #783c1d;
        }

        ul {
            padding: 0;
            margin-top: 25px;
        }

        li {
            list-style: none;
            background: #f0eafa;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .task-name {
            color: #514267;
            flex: 1;
            overflow-wrap: anywhere;
        }

        .edit-btn {
            background: #bba4d7;
            color: white;
        }

        .delete-btn {
            background: #d98e9b;
            color: white;
        }

        .complete-btn {
            background: #a0522d;
            color: white;
        }

        .completed {
            text-decoration: line-through;
            color: #81927e;
        }

        .empty {
            text-align: center;
            color: #888;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
                margin: 20px auto;
            }

            .input-section {
                flex-direction: column;
            }

            .input-section button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 CraftSphere</h1>

    <p class="subtitle">
        Creative Handmade Craft Task Manager
    </p>

    <h3>Add Your Craft Task</h3>

    <div class="input-section">

        <input type="text"
               id="taskInput"
               placeholder="Enter your craft task">

        <button class="add-btn"
                onclick="addTask()">
            Add Task
        </button>

    </div>

    <h3>My Craft Tasks</h3>

    <ul id="taskList"></ul>

</div>

<script>

    // Array to store craft tasks
    let tasks = [];

    // CREATE - Add a new task
    function addTask() {

        let input = document.getElementById("taskInput");

        let taskName = input.value.trim();

        if (taskName === "") {
            alert("Please enter a craft task!");
            return;
        }

        tasks.push({
            name: taskName,
            completed: false
        });

        input.value = "";

        displayTasks();
    }

    // READ - Display all tasks
    function displayTasks() {

        let list = document.getElementById("taskList");

        list.innerHTML = "";

        if (tasks.length === 0) {

            list.innerHTML =
                '<p class="empty">No craft tasks added yet!</p>';

            return;
        }

        tasks.forEach(function(task, index) {

            let li = document.createElement("li");

            let span = document.createElement("span");

            span.className = "task-name";

            span.textContent = task.name;

            if (task.completed) {
                span.classList.add("completed");
            }

            // UPDATE - Edit button
            let editBtn = document.createElement("button");

            editBtn.textContent = "Edit";
            editBtn.className = "edit-btn";

            editBtn.onclick = function() {
                updateTask(index);
            };

            // COMPLETE button
            let completeBtn = document.createElement("button");

            completeBtn.textContent =
                task.completed ? "Undo" : "Done";

            completeBtn.className = "complete-btn";

            completeBtn.onclick = function() {
                tasks[index].completed =
                    !tasks[index].completed;

                displayTasks();
            };

            // DELETE button
            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete-btn";

            deleteBtn.onclick = function() {
                deleteTask(index);
            };

            li.appendChild(span);
            li.appendChild(editBtn);
            li.appendChild(completeBtn);
            li.appendChild(deleteBtn);

            list.appendChild(li);

        });
    }

    // UPDATE - Modify an existing task
    function updateTask(index) {

        let newTask = prompt(
            "Enter the updated craft task:",
            tasks[index].name
        );

        if (newTask !== null && newTask.trim() !== "") {

            tasks[index].name = newTask.trim();

            displayTasks();
        }
    }

    // DELETE - Remove a task
    function deleteTask(index) {

        if (confirm("Are you sure you want to delete this craft task?")) {

            tasks.splice(index, 1);

            displayTasks();
        }
    }

</script>

</body>
</html>
